<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="1000" cy="150" r="280" fill="#d97706" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="500" r="250" fill="#4f46e5" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Frame & Border Glow -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#brandGrad)" stroke-width="3" opacity="0.4" />

  <!-- Geometric Decorative Lines (Engineering Aesthetics) -->
  <g stroke="#f59e0b" stroke-width="1.5" opacity="0.25" fill="none">
    <circle cx="980" cy="315" r="160" stroke-dasharray="8 8" />
    <circle cx="980" cy="315" r="210" stroke-dasharray="4 12" />
    <line x1="770" y1="315" x2="1190" y2="315" />
    <line x1="980" y1="105" x2="980" y2="525" />
  </g>

  <!-- Large Right Graphic Emblem (Graduation Cap & Hub Gear) -->
  <g transform="translate(980, 315)">
    <!-- Outer Gear Geometry -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#brandGrad)" stroke-width="6" opacity="0.8" />
    
    <!-- Central Badge -->
    <rect x="-80" y="-80" width="160" height="160" rx="36" fill="#0f172a" stroke="#d97706" stroke-width="4" />
    
    <!-- Cap Icon -->
    <g transform="scale(0.8)">
      <path d="M 0 -50 L 80 -10 L 0 30 L -80 -10 Z" fill="url(#brandGrad)" />
      <path d="M -45 5 C -45 35, 45 35, 45 5 L 45 20 C 45 50, -45 50, -45 20 Z" fill="#f59e0b" opacity="0.9" />
      <path d="M 65 -5 L 75 35 L 70 60" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none" />
      <circle cx="70" cy="60" r="7" fill="#fbbf24" />
    </g>
  </g>

  <!-- Left Content Area (Arabic & English Brand Copy) -->
  <g transform="translate(100, 140)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#d97706" opacity="0.18" stroke="#f59e0b" stroke-width="1.5" />
    <text x="170" y="26" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="900" fill="#fbbf24" text-anchor="middle">
      جامعة طنطا الأهلية • TNU
    </text>

    <!-- Main Title (EngHub Wordmark) -->
    <text x="0" y="125" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Eng<tspan fill="#f59e0b">Hub</tspan>
    </text>

    <!-- Arabic Subtitle / Description -->
    <text x="0" y="195" font-family="'Segoe UI', 'Amiri', 'Noto Sans Arabic', sans-serif" font-size="34" font-weight="800" fill="#f8fafc">
      المنصة الأكاديمية الموحدة لكلية الهندسة
    </text>

    <text x="0" y="245" font-family="'Segoe UI', 'Amiri', 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      المقررات الدراسية • بنك الأسئلة والواجبات • الذكاء الاصطناعي • المكتبة المركزية
    </text>

    <!-- Feature Chips Footer -->
    <g transform="translate(0, 310)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="160" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="80" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">
        📚 12+ مقرر هندسي
      </text>

      <!-- Chip 2 -->
      <rect x="175" y="0" width="180" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="265" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">
        ⚡ Gemini 3.6 Flash
      </text>

      <!-- Chip 3 -->
      <rect x="370" y="0" width="160" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="450" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">
        🏛️ كلية الهندسة
      </text>
    </g>
  </g>
</svg>
