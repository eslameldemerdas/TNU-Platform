<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="engHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#engHubGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Graduation Cap & Engineering Geometry Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Graduation Cap Top -->
    <path d="M 0 -100 L 160 -20 L 0 60 L -160 -20 Z" fill="url(#engHubGrad)"/>
    <!-- Cap Base -->
    <path d="M -90 10 C -90 60, 90 60, 90 10 L 90 40 C 90 90, -90 90, -90 40 Z" fill="#f59e0b" opacity="0.95"/>
    <!-- Tassel -->
    <path d="M 130 -10 L 150 70 L 140 120" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="140" cy="120" r="14" fill="#fbbf24"/>
  </g>
</svg>
